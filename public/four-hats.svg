<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="'Heebo', 'Helvetica Neue', Arial, sans-serif" direction="rtl">
  <!-- background -->
  <rect x="0" y="0" width="1600" height="1200" fill="#000000"/>

  <!-- title -->
  <text x="800" y="92" text-anchor="middle" fill="#ffffff" font-size="54" font-weight="800" direction="rtl">ארבעה כובעים</text>
  <text x="800" y="148" text-anchor="middle" fill="#1d9bf0" font-size="30" font-weight="600" direction="rtl">ארבעה מקומות שבהם AI מזיז את שורת הרווח</text>

  <!-- spokes (drawn first, sit behind cards) -->
  <g stroke="#3a4651" stroke-width="3">
    <line x1="800" y1="600" x2="1170" y2="330"/>
    <line x1="800" y1="600" x2="430"  y2="330"/>
    <line x1="800" y1="600" x2="1170" y2="870"/>
    <line x1="800" y1="600" x2="430"  y2="870"/>
  </g>

  <!-- center node -->
  <circle cx="800" cy="600" r="120" fill="#16181c" stroke="#1d9bf0" stroke-width="5"/>
  <text x="800" y="592" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="800" direction="rtl">העסק</text>
  <text x="800" y="640" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="800" direction="rtl">שלך</text>

  <!-- ============ CARD: מוצר ושירות (top-right) ============ -->
  <g>
    <rect x="940" y="225" width="460" height="210" rx="20" fill="#16181c" stroke="#2f3336" stroke-width="2"/>
    <!-- package icon -->
    <g transform="translate(1170,275)" stroke="#1d9bf0" stroke-width="3.5" fill="none" stroke-linejoin="round">
      <rect x="-26" y="-18" width="52" height="40" rx="3"/>
      <line x1="-26" y1="-4" x2="26" y2="-4"/>
      <line x1="0" y1="-18" x2="0" y2="-4"/>
    </g>
    <text x="1170" y="345" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="800" direction="rtl">מוצר ושירות</text>
    <text x="1170" y="385" text-anchor="middle" fill="#b8bcbf" font-size="22" direction="rtl">שירות חכם יותר ללקוח. סוכנים</text>
    <text x="1170" y="414" text-anchor="middle" fill="#b8bcbf" font-size="22" direction="rtl">שעונים, מתעדים ופותרים לבד.</text>
  </g>

  <!-- ============ CARD: שיווק (top-left) ============ -->
  <g>
    <rect x="200" y="225" width="460" height="210" rx="20" fill="#16181c" stroke="#2f3336" stroke-width="2"/>
    <!-- megaphone icon -->
    <g transform="translate(430,275)" stroke="#1d9bf0" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M -26 -9 L 10 -22 L 10 22 L -26 9 Z"/>
      <path d="M -26 -9 L -26 9 L -15 9 L -15 -5 Z" fill="#1d9bf0"/>
      <path d="M 20 -10 q 11 10 0 20"/>
    </g>
    <text x="430" y="345" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="800" direction="rtl">שיווק</text>
    <text x="430" y="385" text-anchor="middle" fill="#b8bcbf" font-size="22" direction="rtl">מנגנוני תוכן ושיווק, אורגני וממומן.</text>
    <text x="430" y="414" text-anchor="middle" fill="#b8bcbf" font-size="22" direction="rtl">מיליוני חשיפות מוכחות.</text>
  </g>

  <!-- ============ CARD: מכירות (bottom-right) ============ -->
  <g>
    <rect x="940" y="765" width="460" height="210" rx="20" fill="#16181c" stroke="#2f3336" stroke-width="2"/>
    <!-- growth arrow icon -->
    <g transform="translate(1170,815)" stroke="#1d9bf0" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-26,18 -8,-2 6,12 24,-16"/>
      <polyline points="13,-16 24,-16 24,-5"/>
    </g>
    <text x="1170" y="885" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="800" direction="rtl">מכירות</text>
    <text x="1170" y="925" text-anchor="middle" fill="#b8bcbf" font-size="22" direction="rtl">ניהול לקוח, חיבור ל־CRM,</text>
    <text x="1170" y="954" text-anchor="middle" fill="#b8bcbf" font-size="22" direction="rtl">מערכות גבייה וחשבוניות.</text>
  </g>

  <!-- ============ CARD: תפעול (bottom-left) ============ -->
  <g>
    <rect x="200" y="765" width="460" height="210" rx="20" fill="#16181c" stroke="#2f3336" stroke-width="2"/>
    <!-- sliders / controls icon -->
    <g transform="translate(430,815)" stroke="#1d9bf0" stroke-width="3.5" fill="#16181c" stroke-linecap="round">
      <line x1="-28" y1="-15" x2="28" y2="-15"/>
      <circle cx="11" cy="-15" r="6.5"/>
      <line x1="-28" y1="0" x2="28" y2="0"/>
      <circle cx="-9" cy="0" r="6.5"/>
      <line x1="-28" y1="15" x2="28" y2="15"/>
      <circle cx="15" cy="15" r="6.5"/>
    </g>
    <text x="430" y="885" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="800" direction="rtl">תפעול</text>
    <text x="430" y="925" text-anchor="middle" fill="#b8bcbf" font-size="22" direction="rtl">אקסלים שבורים הופכים</text>
    <text x="430" y="954" text-anchor="middle" fill="#b8bcbf" font-size="22" direction="rtl">לפלטפורמה אחת חיה.</text>
  </g>

  <!-- ============ footer flow ============ -->
  <g>
    <text x="1240" y="1095" text-anchor="middle" fill="#e7e9ea" font-size="26" font-weight="700" direction="rtl">מיפוי</text>
    <text x="1015" y="1095" text-anchor="middle" fill="#1d9bf0" font-size="30" font-weight="800">&#8592;</text>
    <text x="800"  y="1095" text-anchor="middle" fill="#e7e9ea" font-size="26" font-weight="700" direction="rtl">ניצחון ראשון</text>
    <text x="560"  y="1095" text-anchor="middle" fill="#1d9bf0" font-size="30" font-weight="800">&#8592;</text>
    <text x="345"  y="1095" text-anchor="middle" fill="#e7e9ea" font-size="26" font-weight="700" direction="rtl">טרנספורמציה מלאה</text>
  </g>

  <!-- brand -->
  <text x="800" y="1162" text-anchor="middle" fill="#71767b" font-size="22" font-weight="800" letter-spacing="1">yuvkesh</text>
</svg>
