<html lang="he" dir="rtl">
<head>

  <!-- Open Graph -->
  <meta property="og:title" content="yuvalkesh" />
  <meta property="og:description" content="להצטרפות לקבוצה בינה מלאכותית עסקית של יובל קשטכר" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-1: #43377a;
      --bg-2: #8b5cf6;
      --bg-3: #ec4899;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
      background-attachment: fixed;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 56px 18px 40px;
      overflow-x: hidden;
    }

    /* soft animated glow blobs */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      background: #f472b6;
      top: -160px;
      inset-inline-end: -120px;
      animation: float1 14s ease-in-out infinite;
    }
    body::after {
      background: #6366f1;
      bottom: -180px;
      inset-inline-start: -140px;
      animation: float2 16s ease-in-out infinite;
    }
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-30px, 40px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -40px); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      border: 3px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
      margin-bottom: 16px;
      user-select: none;
    }

    .handle {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.2px;
      margin-bottom: 6px;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.18);
    }

    .bio {
      font-size: 15px;
      font-weight: 400;
      opacity: 0.92;
      text-align: center;
      max-width: 360px;
      line-height: 1.5;
      margin-bottom: 34px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 64px;
      padding: 14px 56px;
      background: rgba(255, 255, 255, 0.97);
      color: #1f2330;
      border-radius: 16px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      overflow: hidden;
    }
    .link:hover {
      transform: scale(1.025);
      background: #fff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
    }
    .link:active {
      transform: scale(0.985);
    }

    .link .ico {
      position: absolute;
      inset-inline-start: 16px;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex: none;
    }
    .link .ico svg { width: 22px; height: 22px; fill: #fff; }
    .ico-whatsapp { background: #25d366; }
    .ico-twitter  { background: #000; }
    .ico-facebook { background: #1877f2; }

    .link .label { line-height: 1.35; }

    .footer {
      margin-top: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0.85;
    }
    .footer .brand {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.3px;
    }
    .footer .sub { font-size: 12px; opacity: 0.8; }

    @media (max-width: 420px) {
      body { padding-top: 44px; }
      .link { font-size: 16px; padding: 14px 52px; }
      .handle { font-size: 19px; }
    }
  </style>
</head>
